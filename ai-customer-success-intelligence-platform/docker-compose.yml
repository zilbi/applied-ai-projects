services:
  postgres:
    image: pgvector/pgvector:pg16
    container_name: csm_assistant_postgres
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-csm_assistant}
      POSTGRES_USER: ${POSTGRES_USER:-csm_user}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:?Set POSTGRES_PASSWORD in .env}
    ports:
      - "5432:5432"
    volumes:
      - postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-csm_user} -d ${POSTGRES_DB:-csm_assistant}"]
      interval: 5s
      timeout: 5s
      retries: 10

volumes:
  postgres_data:
