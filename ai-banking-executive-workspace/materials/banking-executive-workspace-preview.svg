    <g transform="translate(286 205)"><rect width="194" height="96" rx="13" fill="#fff9f2" stroke="#f0dfc8"/><text x="18" y="28" fill="#88745e" font-size="13">Clients at risk</text><text x="18" y="66" fill="#9a5a16" font-size="31" font-weight="750">7</text><text x="18" y="86" fill="#b36b1e" font-size="12">3 high priority</text></g>
    <g transform="translate(496 205)"><rect width="194" height="96" rx="13" fill="#f8fbfc" stroke="#dce7eb"/><text x="18" y="28" fill="#71838c" font-size="13">Open tasks</text><text x="18" y="66" fill="#173449" font-size="31" font-weight="750">18</text><text x="18" y="86" fill="#208763" font-size="12">6 due today</text></g>
