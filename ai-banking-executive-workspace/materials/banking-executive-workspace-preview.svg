    <filter id="shadow"><feDropShadow dx="0" dy="8" stdDeviation="12" flood-color="#183a52" flood-opacity="0.10"/></filter>
  </defs>
  <rect width="1200" height="680" rx="28" fill="url(#bg)"/>
  <rect x="38" y="34" width="1124" height="612" rx="22" fill="#ffffff" filter="url(#shadow)"/>
