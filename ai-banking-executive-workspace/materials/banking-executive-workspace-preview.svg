  <text x="884" y="491" fill="#526c63" font-family="Inter,Arial,sans-serif" font-size="12">2. Prepare Atlas meeting brief</text>
  <text x="884" y="513" fill="#526c63" font-family="Inter,Arial,sans-serif" font-size="12">3. Close six tasks due today</text>
  <rect x="868" y="548" width="151" height="31" rx="8" fill="#2eb67d"/><text x="943" y="569" fill="#fff" text-anchor="middle" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700">Create daily digest</text>
