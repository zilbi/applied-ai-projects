  <g fill="#75868f" font-family="Inter,Arial,sans-serif" font-size="12" font-weight="700"><text x="98" y="412">CLIENT</text><text x="392" y="412">HEALTH</text><text x="515" y="412">RISK</text><text x="645" y="412">NEXT ACTION</text></g>
